# Torrentino third-party dependency lock (WP-01).
#
# Role: single source of truth for every pinned native dependency of the engine.
# Consumed by: Native/ThirdParty/libtorrent/build.sh (sourced as shell fragment).
# Must not: contain logic, paths or anything host specific — pins only.
#
# Every entry pins: upstream tag, git commit SHA-1 of that tag, distributed
# archive URL and the SHA-256 of that archive as published by upstream.
# A mismatch is a hard build failure (never "warn and continue"): a silently
# swapped tarball is the cheapest supply-chain attack on a torrent client.


# ---------------------------------------------------------------------------
# Sparkle (manual in-app updates, WP-19) — MIT
# The Xcode project pins the SPM repository to this exact tag. The release
# archive checksum below is the published Sparkle-for-Swift-Package-Manager
# artifact used to verify the binary dependency before release packaging.
# ---------------------------------------------------------------------------
SPARKLE_VERSION="2.9.6"
SPARKLE_TAG="2.9.6"
SPARKLE_SPM_REPOSITORY="https://github.com/sparkle-project/Sparkle.git"
SPARKLE_ARCHIVE_URL="https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-for-Swift-Package-Manager.zip"
SPARKLE_ARCHIVE="Sparkle-for-Swift-Package-Manager.zip"
SPARKLE_SHA256="8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606"
# ---------------------------------------------------------------------------
# libtorrent (primary engine candidate) — BSD-3-Clause
# ---------------------------------------------------------------------------
LT_DEFAULT_VERSION="2.1.1"
LT_SUPPORTED_VERSIONS="2.1.1 2.0.14"

# libtorrent 2.1.1 — released 2026-08-10, branch RC_2_1 (latest stable 2.x).
# SEC-2 (WP-13 security audit): supersedes 2.1.0; upstream fixes compiled-in
# memory-safety paths (DHT salt limit, i2p SAM stack buffer, merkle tree).
LT_2_1_1_TAG="v2.1.1"
LT_2_1_1_COMMIT="56ae8caba38bf154ffc210403cb23f91d0ecaa49"
LT_2_1_1_URL="https://github.com/arvidn/libtorrent/releases/download/v2.1.1/libtorrent-rasterbar-2.1.1.tar.gz"
LT_2_1_1_ARCHIVE="libtorrent-rasterbar-2.1.1.tar.gz"
LT_2_1_1_SHA256="0f163516ecef2e3331500266751de3098835a3c3ae0c2290448046c632bc0e93"
LT_2_1_1_DIR="libtorrent-rasterbar-2.1.1"

# libtorrent 2.0.14 — released 2026-08-10, branch RC_2_0 (maintenance
# fallback). SEC-2: supersedes 2.0.13 on the same hardening delta as 2.1.1.
LT_2_0_14_TAG="v2.0.14"
LT_2_0_14_COMMIT="aab2a10e2f60d9eac78e885a696736d043527794"
LT_2_0_14_URL="https://github.com/arvidn/libtorrent/releases/download/v2.0.14/libtorrent-rasterbar-2.0.14.tar.gz"
LT_2_0_14_ARCHIVE="libtorrent-rasterbar-2.0.14.tar.gz"
LT_2_0_14_SHA256="1b0b21b9755b5fbec23ca9ba2d2d10434ecb6711c39f37f5fc9d5aa25cf369c9"
LT_2_0_14_DIR="libtorrent-rasterbar-2.0.14"

# ---------------------------------------------------------------------------
# Boost (headers + Boost.System) — BSL-1.0
# libtorrent 2.x consumes Boost as headers only (Boost.System is header-only
# since 1.69), but the CMake package config must exist, so Boost is installed
# with b2 into our own prefix instead of being taken from Homebrew.
# ---------------------------------------------------------------------------
BOOST_VERSION="1.91.0"
BOOST_UNDERSCORE="1_91_0"
BOOST_COMMIT="1a80576db6b70828803819fb6925132193bc5d0e"
BOOST_URL="https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.bz2"
BOOST_ARCHIVE="boost_1_91_0.tar.bz2"
BOOST_SHA256="de5e6b0e4913395c6bdfa90537febd9028ea4c0735d2cdb0cd9b45d5f51264f5"
BOOST_DIR="boost_1_91_0"

# ---------------------------------------------------------------------------
# OpenSSL (HTTPS trackers, SSL torrents, libcrypto for MSE/PE) — Apache-2.0
# 3.5.x is the current LTS branch (support until 2030-04-08).
# ---------------------------------------------------------------------------
OPENSSL_VERSION="3.5.7"
OPENSSL_TAG="openssl-3.5.7"
OPENSSL_URL="https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz"
OPENSSL_ARCHIVE="openssl-3.5.7.tar.gz"
OPENSSL_SHA256="a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
OPENSSL_DIR="openssl-3.5.7"

# ---------------------------------------------------------------------------
# Platform contract for every artifact produced from the pins above.
# ---------------------------------------------------------------------------
TORRENTINO_ARCH="arm64"
TORRENTINO_DEPLOYMENT_TARGET="13.0"
TORRENTINO_CXX_STANDARD="17"
